server:
  port: 8081

spring:
  application:
    # 服務名稱，也是向 Eureka 登記的名稱，呼叫端 @ImportHttpServices 的 group 要用這個
    name: basic-data
  profiles:
    active: local
  jpa:
    hibernate:
      # 依 Entity 自動建立／更新資料表（開發用）
      ddl-auto: update
  datasource:
    url: jdbc:mysql://localhost:3306/basic_data?createDatabaseIfNotExist=true&serverTimezone=Asia/Taipei&characterEncoding=utf-8&useSSL=false
    username: root
eureka:
  client:
    # Eureka Server 位址
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # 以 127.0.0.1 登記，本機開發時避免主機名稱解析不到
    prefer-ip-address: true
    ip-address: 127.0.0.1

