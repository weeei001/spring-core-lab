app:
  display-name: ${APP_DISPLAY_NAME:案步就班}

server:
  port: 8083

spring:
  application:
    name: notification-service
  profiles:
    default: local
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: false
  jpa:
    open-in-view: false
  mail:
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

# 健康檢查只在獨立的 loopback port 提供；不公開設定或錯誤細節。
management:
  server:
    address: 127.0.0.1
    port: 9083
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: always
  health:
    mail:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:mysql://localhost:3306/notification?createDatabaseIfNotExist=true&serverTimezone=Asia/Taipei&characterEncoding=utf-8&useSSL=false
    username: root
  mail:
    host: smtp.gmail.com
    port: 587
app:
  frontend-url: http://localhost:3000
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: "${app.display-name} <no-reply@localhost>"
    max-attempts: 3
    retry-interval: PT1M
eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
