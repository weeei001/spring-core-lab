server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SPRING_CORE_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: web-server
  profiles:
    default: local
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  security:
    oauth2:
      client:
        registration:
          authentik:
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/auth/callback"

# 健康檢查只在獨立的 loopback port 提供；不公開設定或錯誤細節。
management:
  server:
    address: 127.0.0.1
    port: 9080
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: always
  health:
    mail:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  session:
    jdbc:
      initialize-schema: always
  datasource:
    url: ${WEB_SESSION_DB_URL:jdbc:mysql://localhost:3306/basic_data?serverTimezone=Asia/Taipei&characterEncoding=utf-8&useSSL=false}
    username: ${WEB_SESSION_DB_USERNAME:root}
    password: ${WEB_SESSION_DB_PASSWORD:}
server:
  forward-headers-strategy: framework
app:
  frontend-url: http://localhost:3000/
  super-admin-subjects: ""
eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
