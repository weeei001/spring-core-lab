server:
  port: 8082

spring:
  application:
    name: project-service
  profiles:
    default: local
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false

# 健康檢查只在獨立的 loopback port 提供；不公開設定或錯誤細節。
management:
  server:
    address: 127.0.0.1
    port: 9082
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: always
  health:
    mail:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:mysql://localhost:3306/project?createDatabaseIfNotExist=true&serverTimezone=Asia/Taipei&characterEncoding=utf-8&useSSL=false
    username: root
project:
  attachment:
    dir: ${APP_LEGACY_ATTACHMENT_DIR:data/attachments}
eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
