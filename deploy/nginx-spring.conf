# Install as /etc/nginx/sites-available/spring.
# Certbot will add HTTPS to this server after DNS and HTTP validation work.
server {
    listen 80;
    server_name project-manage.jianwii.dev;

    root /opt/spring/current/frontend;
    index index.html;
    client_max_body_size 11m;

    # This deployment receives traffic directly, with Cloudflare set to DNS only.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    # Keep the backend context at / so the frontend can read the CSRF cookie.
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";

    location = /backend {
        return 308 /backend/;
    }

    location /backend/ {
        # The trailing slash removes /backend/ before forwarding.
        proxy_pass http://127.0.0.1:8080/;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
